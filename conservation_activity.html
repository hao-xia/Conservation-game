<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Conservation Planning Game</title>
  <style>
    :root {
      --accent: #2563eb;
      --muted: #6b7280;
      --card: #ffffff;
      --bg: #eef2ff;
      --selected: #065f46;
      --green-bg: #d1fae5;
      --border-radius: 16px;
    }

    body {
      margin: 0;
      font-family: 'Poppins', 'Inter', sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, #e0f7fa 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wrap {
      max-width: 1200px;
      width: 95%;
      margin-top: 40px;
      margin-bottom: 40px;
      background: var(--card);
      border-radius: var(--border-radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 26px;
      margin: 0;
      color: var(--accent);
    }

    p.lead {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #1e40af;
      transform: translateY(-1px);
    }

    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto auto;
      gap: 20px;
    }

    .grid-card {
      background: var(--card);
      border-radius: var(--border-radius);
      box-shadow: 0 6px 16px rgba(2, 6, 23, 0.06);
      padding: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .grid-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(2, 6, 23, 0.1);
    }

    .grid-title {
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cell {
      background: #f8fafc;
      border-radius: 10px;
      padding: 16px;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 18px;
      position: relative;
    }

    .cell:hover {
      background: #e0f2fe;
      transform: translateY(-3px);
    }

    .cell.selected {
      background: var(--green-bg);
      outline: 3px solid #10b981;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
    }

    .cell .count {
      font-weight: 700;
      color: #0f172a;
    }

    .cell.selected .count {
      color: var(--selected);
      font-weight: 900;
    }

    .protected-label {
      font-size: 12px;
      color: #065f46;
      margin-top: 4px;
      font-weight: 600;
    }

    .sidebar {
      background: var(--card);
      border-radius: var(--border-radius);
      box-shadow: 0 6px 16px rgba(2, 6, 23, 0.06);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .stat {
      font-weight: 800;
      font-size: 28px;
      color: var(--accent);
    }

    .muted {
      color: var(--muted);
    }

    #details {
      text-align: left;
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Interactive Conservation Planning Game</h1>
        <p class="lead">Select up to <strong>3 cells</strong> in any grid. The same cells across all taxa become protected areas!</p>
      </div>
      <div class="controls">
        <div class="muted">Selected: <span id="selectedCount">0</span>/3</div>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </header>

    <div class="layout" id="layoutContainer"></div>
  </div>

  <script>
    const TAXA = [
      { name: 'Birds', icon: '🦜' },
      { name: 'Mammals', icon: '🦌' },
      { name: 'Reptiles', icon: '🦎' },
      { name: 'Amphibians', icon: '🐸' },
      { name: 'Plants', icon: '🌿' }
    ];

    const GRID_SIZE = 3;
    const MAX_SELECTION = 3;
    const rand = (() => { let x = 12345; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967295; }; })();

    const grids = {};
    TAXA.forEach(t => {
      const cells = [];
      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        cells.push({ count: 3 + Math.floor(rand() * 7) });
      }
      grids[t.name] = cells;
    });

    const state = { selected: new Set() };

    const layoutContainer = document.getElementById('layoutContainer');

    function createGridCard(taxonObj) {
      const taxon = taxonObj.name;
      const card = document.createElement('div');
      card.className = 'grid-card';
      const title = document.createElement('div');
      title.className = 'grid-title';
      title.textContent = `${taxonObj.icon} ${taxon}`;

      const grid = document.createElement('div');
      grid.className = 'grid';
      grids[taxon].forEach((cell, idx) => {
        const el = document.createElement('div');
        el.className = 'cell';
        el.dataset.pos = idx;
        const count = document.createElement('div');
        count.className = 'count';
        count.textContent = cell.count;
        el.appendChild(count);
        el.addEventListener('click', () => handleSelection(idx));
        grid.appendChild(el);
      });

      card.appendChild(title);
      card.appendChild(grid);
      return card;
    }

    function renderLayout() {
      layoutContainer.innerHTML = '';
      for (let i = 0; i < 3; i++) layoutContainer.appendChild(createGridCard(TAXA[i]));
      for (let i = 3; i < 5; i++) layoutContainer.appendChild(createGridCard(TAXA[i]));

      const sidebar = document.createElement('div');
      sidebar.className = 'sidebar';
      sidebar.innerHTML = `
        <div class="muted">Total Summed Species Diversity</div>
        <div class="stat" id="totalSpecies">0</div>
        <div id="details"></div>
      `;
      layoutContainer.appendChild(sidebar);
    }

    function handleSelection(pos) {
      if (state.selected.has(pos)) {
        state.selected.delete(pos);
      } else {
        if (state.selected.size >= MAX_SELECTION) {
          alert('You can select up to 3 cells only.');
          return;
        }
        state.selected.add(pos);
      }
      refresh();
    }

    function refresh() {
      document.querySelectorAll('.cell').forEach(el => {
        const pos = Number(el.dataset.pos);
        if (state.selected.has(pos)) {
          el.classList.add('selected');
          if (!el.querySelector('.protected-label')) {
            const label = document.createElement('div');
            label.className = 'protected-label';
            label.textContent = 'Protected Area';
            el.appendChild(label);
          }
        } else {
          el.classList.remove('selected');
          const label = el.querySelector('.protected-label');
          if (label) label.remove();
        }
      });

      document.getElementById('selectedCount').textContent = state.selected.size;

      let total = 0;
      let detailsHTML = '';

      TAXA.forEach(t => {
        const values = [];
        state.selected.forEach(pos => { values.push(grids[t.name][pos].count); });
        if (values.length > 0) {
          const sum = values.reduce((a, b) => a + b, 0);
          total += sum;
          detailsHTML += `<div><strong>${t.icon} ${t.name}:</strong> ${values.join(' + ')} = ${sum}</div>`;
        }
      });

      document.getElementById('totalSpecies').textContent = total;
      document.getElementById('details').innerHTML = detailsHTML;
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      state.selected.clear();
      refresh();
    });

    renderLayout();
  </script>
</body>
</html>
